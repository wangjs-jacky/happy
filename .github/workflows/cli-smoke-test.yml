name: CLI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'packages/happy-cli/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/happy-cli/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wangjs-jacky/paws build
      - run: pnpm --filter @wangjs-jacky/paws pack --pack-destination packages/happy-cli
      - name: Install and run packed CLI
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find packages/happy-cli -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_file"
          smoke_dir="$(mktemp -d)"
          npm install --prefix "$smoke_dir" --ignore-scripts "$PWD/$package_file"
          expected="happy version: $(node -p "require('./packages/happy-cli/package.json').version")"
          actual="$("$smoke_dir/node_modules/.bin/paws" --version)"
          test "$actual" = "$expected"
          "$smoke_dir/node_modules/.bin/paws" --help >/dev/null

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wangjs-jacky/paws build
      - run: pnpm --filter @wangjs-jacky/paws pack --pack-destination packages/happy-cli
      - name: Run built CLI
        shell: pwsh
        run: |
          $expected = "happy version: $(node -p "require('./packages/happy-cli/package.json').version")"
          $actual = node packages/happy-cli/bin/happy.mjs --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Expected '$expected', got '$actual'"
          }
