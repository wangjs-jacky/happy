name: Paws Agent npm publish

on:
  push:
    tags: ['paws-agent-v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: paws-agent-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate immutable release contract
        id: contract
        shell: bash
        run: PAWS_TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")" node packages/paws-agent/scripts/release-contract.mjs
      - run: pnpm --filter @wangjs-jacky/paws-agent test
      - run: pnpm --filter @wangjs-jacky/paws-agent test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pack once
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paws-agent"
          cd packages/paws-agent
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/paws-agent"
          TARBALL="$(find "$RUNNER_TEMP/paws-agent" -name '*.tgz' -print -quit)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$TARBALL" | tee "$RUNNER_TEMP/paws-agent/SHA256SUMS"
      - name: Verify the exact release tarball
        shell: bash
        run: PAWS_AGENT_DIST_TAG="${{ steps.contract.outputs.dist_tag }}" node packages/paws-agent/scripts/verify-pack.mjs "${{ steps.pack.outputs.tarball }}"
      - name: Check exact registry version
        id: registry
        shell: bash
        run: |
          if npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        run: |
          set +e
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "${{ steps.contract.outputs.dist_tag }}"
          publish_status=$?
          set -e
          if [ "$publish_status" -ne 0 ]; then
            published_version="$(npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version 2>/dev/null || true)"
            if [ "$published_version" != "${{ steps.contract.outputs.version }}" ]; then
              exit "$publish_status"
            fi
            echo "Publish returned $publish_status, but the immutable version is present; continuing verification."
          fi
      - name: Wait for exact registry version
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            published_version="$(npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version 2>/dev/null || true)"
            if [ "$published_version" = "${{ steps.contract.outputs.version }}" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Exact npm version did not become visible within five minutes" >&2
          exit 1
      - name: Verify exact registry install in Node and Chromium consumers
        shell: bash
        env:
          PAWS_AGENT_INSTALL_SPEC: '@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}'
          PAWS_AGENT_DIST_TAG: '${{ steps.contract.outputs.dist_tag }}'
        run: node packages/paws-agent/scripts/verify-pack.mjs "${{ steps.pack.outputs.tarball }}"
      - name: Rerun package and isolated E2E smoke tests after publication
        run: |
          pnpm --filter @wangjs-jacky/paws-agent test
          pnpm --filter @wangjs-jacky/paws-agent test:integration
      - name: Create immutable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" "$RUNNER_TEMP/paws-agent/SHA256SUMS" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
