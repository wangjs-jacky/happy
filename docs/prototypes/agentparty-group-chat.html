<style>

*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:var(--sm)/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 14px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}button.quiet{border-color:transparent;background:transparent}button.link{padding:0;border:0;color:var(--accent);background:transparent;font-size:var(--xs)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:var(--xl);letter-spacing:-.5px}h2{font-size:var(--lg)}h3{font-size:var(--base)}small,.muted{color:var(--muted)}small{font-size:var(--xs)}[hidden]{display:none!important}.banner{text-align:center;background:var(--tint);color:var(--muted);padding:8px 16px;font-size:var(--xs)}.banner button{margin-left:12px}.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:calc(100dvh - 39px);min-height:630px}.sidebar{padding:28px 16px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.brand{font-size:var(--xl);font-weight:700;letter-spacing:-1px;margin:0 12px 24px}.brand span{color:var(--accent);margin-right:8px}.nav{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:12px}.nav.active,.room-item.selected{background:var(--tint);color:var(--accent)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 12px 8px;color:var(--muted);font-size:var(--xs)}.room-item{text-align:left;width:100%;margin-bottom:8px;padding:14px;border:1px solid transparent;background:transparent}.room-item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.room-item small{display:block;margin-top:4px}.footnote{margin-top:auto;padding:24px 12px 0;font-size:var(--xs);color:var(--muted)}.workspace{min-width:0;display:flex;flex-direction:column}.room-header{padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.room-header p{color:var(--muted);margin-top:4px}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;flex:1;min-height:0}.conversation{display:flex;flex-direction:column;min-width:0;min-height:0}.timeline{overflow:auto;flex:1;padding:32px max(24px,6%)}.message{margin-bottom:32px;display:flex;gap:16px}.message-body{flex:1;min-width:0}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.meta time{margin-left:auto;color:var(--muted);font-size:var(--xs)}.message p{white-space:pre-wrap;margin:12px 0;color:var(--ink);font-size:var(--base);line-height:1.85}.message.user .message-body{background:var(--tint);border-radius:var(--r);padding:16px 20px}.message.user p{margin:4px 0}.tag{font-size:11px;background:var(--soft);padding:2px 7px;border-radius:6px;color:var(--muted)}.avatar{width:40px;height:40px;flex-shrink:0;border-radius:var(--r);background:var(--tint);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:var(--lg);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:64px;height:64px;font-size:var(--xl)}.system{text-align:center;color:var(--muted);font-size:var(--xs);margin:24px 0}.members{border-left:1px solid var(--line);background:var(--bg);padding:24px;overflow:auto}.member{margin:24px 0}.member p{color:var(--muted);margin:12px 0;font-size:var(--sm)}.device{font-size:var(--xs);color:var(--muted);overflow-wrap:anywhere;margin:5px 0 8px}.rules{border:1px solid var(--line);padding:16px;border-radius:var(--r);font-size:var(--xs);color:var(--muted);margin-top:32px}.rules b{display:block;color:var(--ink);margin-bottom:8px}.composer{border-top:1px solid var(--line);padding:16px 24px 20px}.examples{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.examples button{font-size:var(--xs);padding:5px 10px}.compose-box{border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--bg)}textarea{resize:vertical}.compose-box textarea{width:100%;min-height:70px;border:0;background:transparent;outline:none;padding:4px;font-size:var(--sm)}.hint{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:var(--xs)}.mention-menu{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}.mention-menu button{font-size:var(--xs)}.images{display:flex;gap:12px;flex-wrap:wrap}.image-wrap{position:relative}.image-wrap img{width:76px;height:64px;object-fit:cover;border-radius:8px}.image-wrap button{position:absolute;top:-6px;right:-6px;border-radius:50%;padding:0 6px;background:var(--paper)}.message-images img{max-width:180px;max-height:150px;border-radius:var(--r);margin:8px}.switch{display:inline-block;width:28px;height:16px;border-radius:16px;background:var(--accent);vertical-align:middle;margin-right:8px}.switch:after{content:'';display:block;width:12px;height:12px;margin:2px 2px 2px 14px;border-radius:50%;background:var(--paper)}[aria-pressed=false] .switch{background:var(--muted)}[aria-pressed=false] .switch:after{margin-left:2px}dialog{border:1px solid var(--line);border-radius:var(--big);padding:0;color:var(--ink);box-shadow:var(--shadow);width:min(680px,94vw);max-height:90dvh}dialog::backdrop{background:var(--overlay);backdrop-filter:blur(3px)}dialog header{padding:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}dialog .body{padding:24px}dialog footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg)}label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:16px}input:not([type=checkbox]),select,dialog textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:6px}label small{display:block;font-weight:400;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{background:var(--soft);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:var(--xs);margin:16px 0}.agent-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}.agent-card p{margin:8px 0;color:var(--muted)}.choice{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:var(--r);font-weight:400}.choice:has(input:checked){background:var(--tint);border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1}.error{color:var(--danger)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--r);z-index:20;max-width:90vw}#toast:empty{display:none}.steps{padding-left:20px;color:var(--muted)}.steps li{margin:16px 0}input[type=file]{display:none}.mobile-members{display:none}@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.layout{grid-template-columns:minmax(0,1fr) 235px}.room-header{padding:20px 24px}.members{padding:20px 16px}.timeline{padding:24px}.brand{font-size:var(--lg)}}@media(max-width:820px){.app{height:auto;min-height:100dvh;grid-template-columns:1fr}.sidebar{padding:12px 16px;display:grid;grid-template-columns:1fr auto auto;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:6px 0}.section-title,.footnote{display:none}.room-list{grid-column:1/-1;display:flex;gap:8px;overflow:auto}.room-item{min-width:170px;width:auto;margin:0;padding:8px 12px}.layout{display:flex;flex-direction:column-reverse}.members{border-left:0;border-bottom:1px solid var(--line);max-height:250px}.members .member{display:inline-block;width:48%;vertical-align:top;margin:16px 0}.members .rules,.members .member p{display:none}.room-header{padding:20px;align-items:flex-start}.room-header h1{font-size:var(--lg)}.room-header .row{flex-direction:column;gap:8px}.timeline{min-height:320px;max-height:55dvh;padding:24px 16px}.composer{padding:16px}.hint{flex-wrap:wrap}.two{grid-template-columns:1fr;gap:0}.message{gap:12px}.message p{font-size:var(--sm)}dialog .body,dialog header{padding:20px}.banner{font-size:11px} .meta time{display:none}}
</style></head>
<body><div class="banner">交互重建稿 · 预设模拟，不调用真实 Agent · 刷新重置 <button class="link" data-action="about">这版能体验什么 ↗</button></div>
<div class="app"><aside class="sidebar"><div class="brand"><span>▥</span>AgentParty</div><button class="nav active" data-action="chat">◯　群聊 <span id="room-count"></span></button><button class="nav" data-action="library">♧　Agent 管理 <span id="agent-count"></span></button><div class="section-title">我的群聊<button class="quiet" aria-label="新建群聊" data-action="newroom">＋</button></div><nav class="room-list" id="room-list" aria-label="群聊列表"></nav><div class="footnote">● 本地交互演示<br><br>配置、图片和消息仅留在当前页面，不发送到远端。<br>这是按原稿重建的版本，不是原 HTML 恢复。</div></aside><main class="workspace" id="workspace"></main></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog><div id="toast" role="status"></div><input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp"><input type="file" id="message-files" accept="image/png,image/jpeg,image/webp" multiple>
<script>
'use strict';
const $=s=>document.querySelector(s),escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devices=[{id:'mac',name:'demo-mac-mini.local',path:'/Users/demo/AgentWorkspace'},{id:'linux',name:'research-linux',path:'/home/demo/agents'},{id:'offline',name:'travel-macbook.local',path:'/Users/demo/AgentWorkspace',offline:true}];
const models={'gpt-5.6-luna':['low','medium','high'],'gpt-6-astra':['low','medium','high','xhigh']};
let agents=[{id:'pm',name:'产品经理',role:'关注用户需求与产品价值。先判断问题是否值得解决，再给出最小可行方案。',device:'mac'},{id:'eng',name:'技术负责人',role:'关注实现成本、技术约束和开发路径。将想法拆成可验证的小步骤。',device:'linux'},{id:'critic',name:'质疑者',role:'寻找风险、漏洞与反例。对未经验证的假设提出问题，不为反对而反对。',device:'mac'}].map(a=>({...a,avatar:'',model:'gpt-5.6-luna',effort:'low',path:devices.find(d=>d.id===a.device).path}));
let serial=10;const uid=()=>String(++serial),clone=v=>structuredClone(v);
const seed=[{id:'m1',from:'我',text:'我想做一个 AI 管家，帮我记录今天的工作，再给它们排优先级。你们怎么看？',images:[]},{id:'m2',from:'pm',reason:'被你 @ 点名',text:'先聚焦在一个真实习惯上：你愿不愿意每天把当天的事情告诉它？\n\n优先级和提醒可以随后加，先确认记录这一步真的更轻松。',images:[]},{id:'m3',from:'eng',reason:'被你 @ 点名',text:'从实现上看，可以先收敛到一个很小的闭环：\n\n① 对话里记录任务，支持你随时更正。\n② 把任务以列表呈现，保留对应的原始消息。\n③ 只有你确认了时间，才创建提醒。\n\n先不做跨应用抓取，也不自动替你决定截止时间。这样更容易验证价值，边界也清楚。',images:[]}];
const room=(id,title,ids,auto,messages=[])=>({id,title,members:clone(agents.filter(a=>ids.includes(a.id))),auto,messages:clone(messages),draft:'',images:[]});
let rooms=[room('r1','产品想法讨论',['pm','eng'],true,seed),room('r2','日常研究',['eng','critic'],false,[{system:'在这里 @ 研究伙伴，开始一个新的话题。'}])],active='r1',editorState=null,returnFocus=null;
const current=()=>rooms.find(r=>r.id===active),deviceName=a=>devices.find(d=>d.id===a.device)?.name||'未配置设备';
function avatar(a,big=false){return `<span class="avatar ${big?'big':''}">${a.avatar?`<img src="${escapeHTML(a.avatar)}" alt="${escapeHTML(a.name)}的头像">`:escapeHTML(a.name.slice(0,1))}</span>`}
function toast(text){$('#toast').textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function render(){const r=current();$('#room-count').textContent=rooms.length;$('#agent-count').textContent=agents.length;$('#room-list').innerHTML=rooms.map(x=>`<button class="room-item ${x.id===active?'selected':''}" data-action="switch" data-id="${x.id}"><b>${escapeHTML(x.title)}</b><small>${x.members.length} 位 Agent · ${x.auto?'自动接话':'仅 @ 回复'}</small></button>`).join('');$('#workspace').innerHTML=`<header class="room-header"><div><h1>${escapeHTML(r.title)}</h1><p>你与 ${r.members.length} 位 Agent · 每个群聊独立上下文</p></div><div class="row"><button data-action="auto" aria-pressed="${r.auto}"><span class="switch"></span>自动接话</button><button data-action="invite">♧ 邀请成员</button></div></header><div class="layout"><section class="conversation" aria-label="群聊"><div class="timeline" id="timeline" role="log" aria-label="群聊消息"></div><div class="composer"><div class="examples"><small>试一试</small><button data-action="example" data-kind="mention">@ 两位成员</button><button data-action="example" data-kind="auto">不 @，自动接话</button><button data-action="invite">邀请一位新成员</button></div><div class="compose-box"><div id="image-strip" class="images"></div><textarea id="draft" aria-label="消息" placeholder="说点什么，或输入 @ 邀请一位、几位成员回答…"></textarea><div id="mention-menu" class="mention-menu" hidden></div><div class="row between"><div class="row"><button class="quiet" data-action="mentions" aria-label="提及成员">@</button><button class="quiet" data-action="image">▧ 图片 + 文字</button></div><button class="primary" data-action="send">发送 ↑</button></div></div><div class="hint"><span>直接聊天，或 @ 多位成员 · 有 @ 时优先按点名回复</span><span>Enter 发送 · Shift + Enter 换行</span></div></div></section><aside class="members" aria-label="本群成员"><div class="row between"><small>本群成员 · ${r.members.length}</small><button class="link" data-action="invite">＋ 邀请</button></div>${r.members.map(a=>`<article class="member"><div class="row">${avatar(a)}<div><b>${escapeHTML(a.name)}</b>${a.temp?' <span class="tag">临时</span>':''}<br><small>Codex · ${escapeHTML(a.effort)}</small></div></div><p>${escapeHTML(a.role)}</p><div class="device">▣ ${escapeHTML(deviceName(a))}<br>${escapeHTML(a.model)}</div><button class="link" data-action="member" data-id="${a.id}">查看角色与本群配置 ↗</button></article>`).join('')}<div class="rules"><b>${r.auto?'未点名时，按话题接话':'只在 @ 点名时回复'}</b>有 @ 就通知被点名者。没有 @ 时，草图用关键词模拟选人，不会让所有成员轮流回答。<br><br>没有固定主持人，没有强制讨论流程。每位成员使用自己的设备与模型。</div></aside></div>`;$('#draft').value=r.draft;$('#draft').oninput=e=>{r.draft=e.target.value;if(r.draft.endsWith('@'))mentions();else $('#mention-menu').hidden=true};$('#draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#draft').onpaste=e=>{const files=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(files.length){e.preventDefault();addImages(files)}};renderMessages();renderImages()}
function renderMessages(){const r=current();$('#timeline').innerHTML=r.messages.map(m=>{if(m.system)return `<p class="system">${escapeHTML(m.system)}</p>`;const a=r.members.find(a=>a.id===m.from)||{name:'我',avatar:''};return `<article class="message ${m.from==='我'?'user':''}">${avatar(a)}<div class="message-body"><div class="meta"><b>${escapeHTML(a.name)}</b>${m.from==='我'?'':'<span class="tag">Codex</span><span class="tag">预设模拟</span>'}<time>${m.time||'09:42'}</time></div><p>${escapeHTML(m.text)}</p><div class="message-images">${(m.images||[]).map(i=>`<img src="${escapeHTML(i.url)}" alt="${escapeHTML(i.name)}">`).join('')}</div>${m.from==='我'?'':`<small>${escapeHTML(m.reason||'预设示例')}</small>　<button class="link" data-action="detail" data-id="${m.id}">查看执行细节 ↗</button>`}</div></article>`}).join('');$('#timeline').scrollTop=$('#timeline').scrollHeight}
function renderImages(){$('#image-strip').innerHTML=current().images.map((i,n)=>`<div class="image-wrap"><img src="${escapeHTML(i.url)}" alt="${escapeHTML(i.name)}"><button aria-label="移除图片" data-action="remove-image" data-id="${n}">×</button></div>`).join('')}
function mentions(){const menu=$('#mention-menu');menu.hidden=false;menu.innerHTML=current().members.map(a=>`<button data-action="mention" data-id="${a.id}">@${escapeHTML(a.name)}</button>`).join('')+'<button data-action="invite">＋ 邀请其他成员</button>'}
function addImages(files){const r=current();for(const f of files){if(r.images.length>=4){toast('每条消息最多 4 张图片');break}if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){toast('请选择 10 MB 以内的 PNG、JPEG 或 WebP');continue}r.images.push({name:f.name,url:URL.createObjectURL(f)})}renderImages()}
function send(){const r=current(),text=r.draft.trim();if(!text&&!r.images.length)return;const found=[...text.matchAll(/@([^\s@]+)/g)].map(m=>m[1]);const unknown=found.filter(n=>!r.members.some(a=>a.name===n));if(unknown.length){toast('成员不在本群：'+unknown.join('、')+'。请先邀请。');return}const targetIds=[...new Set(found)].map(n=>r.members.find(a=>a.name===n).id);const targets=targetIds.length?targetIds:r.auto?[r.members.find(a=>/技术|实现|代码/.test(text)&&a.id==='eng')?.id||r.members[0].id]:[];const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const hasImages=r.images.length>0;r.messages.push({id:uid(),from:'我',text,images:r.images,time});for(const id of targets){const a=r.members.find(a=>a.id===id);r.messages.push({id:uid(),from:id,time,images:[],reason:found.length?'被你 @ 点名':'关键词模拟自动接话',text:hasImages?'【模拟回复】我收到了这次的图片和文字。正式版会由我在 '+deviceName(a)+' 上分析；当前草图没有识别图片或调用模型。':'【模拟回复】我会从「'+a.role+'」的角度参与讨论。这里用于确认群聊与指派交互，不是真实推理结果。'})}r.images=[];r.draft='';render();if(!targets.length)toast('消息已保留；自动接话关闭，不触发回复')}
function show(title,body,footer=''){const d=$('#modal');if(!d.open)returnFocus=document.activeElement;d.innerHTML=`<header><h2 id="modal-title">${title}</h2><button class="quiet" data-action="close">关闭</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:''}`;if(!d.open)d.showModal();const focus=d.querySelector('input:not([type=checkbox]),textarea,button');focus?.focus()}
function close(){ $('#modal').close();if(returnFocus?.isConnected)returnFocus.focus() }
function library(){show('我的 Agent',`<p class="muted">配置数字员工，再邀请他们进入不同的群聊。</p>${agents.map(a=>`<article class="agent-card"><div class="row between"><div class="row">${avatar(a)}<div><b>${escapeHTML(a.name)}</b><br><small>Codex · 可复用预设</small></div></div><button data-action="edit" data-id="${a.id}">编辑</button></div><p>${escapeHTML(a.role)}</p><small>${escapeHTML(deviceName(a))} · ${escapeHTML(a.model)} · ${escapeHTML(a.effort)}</small></article>`).join('')}<div class="notice">默认配置与群内配置分开。修改预设不会静默改变已经加入群聊的成员。</div>`,`<small>示例配置 · 不读取 Paws 账号</small><button class="primary" data-action="create-agent">＋ 创建 Agent</button>`)}
function editAgent(id=null,temp=false){const a=agents.find(a=>a.id===id)||{id:uid(),name:'',role:'',device:'mac',path:devices[0].path,model:'gpt-5.6-luna',effort:'low',avatar:''};editorState={...clone(a),temp,isNew:!id};show(temp?'创建临时 Agent':id?'编辑 Agent':'创建 Agent',`<form id="agent-form"><div class="row" style="margin-bottom:24px"><div id="avatar-preview">${avatar({...a,name:a.name||'新'},true)}</div><div><button type="button" data-action="avatar">上传头像</button> <button type="button" class="quiet" data-action="remove-avatar">移除</button><br><small>仅用于身份展示，不自动发送给模型 · 最大 5 MB</small></div></div><label>Agent 名称<input name="name" required maxlength="40" value="${escapeHTML(a.name)}" placeholder="例如：研究员"></label><label>角色与关注点<textarea name="role" required rows="2">${escapeHTML(a.role)}</textarea></label><label>运行设备<select name="device">${devices.map(d=>`<option value="${d.id}" ${d.id===a.device?'selected':''} ${d.offline?'disabled':''}>${d.name} · ${d.offline?'离线':'在线'}</option>`).join('')}</select><small>使用可读设备名；内部 ID 不展示给使用者。</small></label><label>工作目录<select name="path"><option>${escapeHTML(a.path)}</option></select><small>示例已授权目录，切换设备时联动更新。</small></label><div class="two"><label>Codex 模型<select name="model">${Object.keys(models).map(m=>`<option ${m===a.model?'selected':''}>${m}</option>`).join('')}</select></label><label>思考强度<select name="effort">${models[a.model].map(e=>`<option ${e===a.effort?'selected':''}>${e}</option>`).join('')}</select></label></div><small>此处是演示模型列表与联动，不代表远端真实可用能力。</small><div class="notice">${temp?'只加入当前群，不进入全局 Agent 库。可读取本群已有文字；历史图片不自动重发。':'保存更新默认配置，已有群成员保留原配置。将来应用新配置时应明确确认，不打断正在进行的回复。'}</div><p id="form-error" class="error" role="alert"></p></form>`,`<button data-action="${temp?'invite':'library'}">返回</button><button class="primary" type="submit" form="agent-form">${temp?'创建并加入本群':'保存配置'}</button>`);const f=$('#agent-form');f.elements.device.onchange=()=>{f.elements.path.innerHTML=`<option>${devices.find(d=>d.id===f.elements.device.value).path}</option>`};f.elements.model.onchange=()=>{f.elements.effort.innerHTML=models[f.elements.model.value].map(e=>`<option>${e}</option>`).join('')};f.onsubmit=e=>{e.preventDefault();const data=new FormData(f),name=data.get('name').trim(),role=data.get('role').trim();if(!name||!role||/[\s@]/u.test(name)){$('#form-error').textContent='请填写角色；名字不要包含空格或 @，便于群内点名。';return}const list=temp?current().members:agents;if(list.some(x=>x.id!==a.id&&x.name===name)){$('#form-error').textContent='名称已存在，请换一个名字。';return}const value={id:a.id,name,role,device:data.get('device'),path:data.get('path'),model:data.get('model'),effort:data.get('effort'),avatar:editorState.avatar,...(temp?{temp:true}:{})};if(temp){current().members.push(value);current().messages.push({system:name+' 以临时成员加入，下一次点名可参与。'});close();render()}else{if(id)agents=agents.map(x=>x.id===id?value:x);else agents.push(value);render();library()}toast(temp?'临时成员已加入（模拟）':'默认配置已保存，已有群配置不变（模拟）')}}
function choices(list,checked=false){return list.map(a=>`<label class="choice"><input name="members" type="checkbox" value="${a.id}" ${checked?'checked':''}>${avatar(a)}<span><b>${escapeHTML(a.name)}</b><small>${escapeHTML(deviceName(a))} · ${escapeHTML(a.model)} · ${escapeHTML(a.effort)}</small></span></label>`).join('')}
function invite(){const available=agents.filter(a=>!current().members.some(m=>m.id===a.id||m.name===a.name));show('邀请成员',`<div class="tabs"><button class="primary" data-action="invite">从我的 Agent 选择</button><button data-action="temporary">创建临时 Agent</button></div><form id="invite-form">${available.length?choices(available):'<p class="muted">可用 Agent 已全部在群里，可以创建临时成员。</p>'}</form><div class="notice"><b>加入后能看到什么？</b><br>本群已有文字上下文，不包括其他群历史；历史图片需重新发送。<br>不插入正在进行的辩论，新成员从下一次讨论开始参与。</div>`,`<small>每位成员沿用自己的执行配置</small><button class="primary" form="invite-form" ${!available.length?'disabled':''}>邀请选中成员</button>`);$('#invite-form').onsubmit=e=>{e.preventDefault();const ids=new FormData(e.target).getAll('members');if(!ids.length){toast('请先选择一位成员');return}for(const id of ids){const a=agents.find(a=>a.id===id);current().members.push(clone(a));current().messages.push({system:a.name+' 加入群聊 · 使用自己的设备与模型'})}close();render();toast('已邀请 '+ids.length+' 位成员（模拟）')}}
function newRoom(){show('新建群聊',`<form id="room-form"><label>群聊名称<input name="title" required maxlength="60" placeholder="例如：新产品讨论"></label><label>邀请成员</label>${choices(agents)}<div class="notice">不需要为整个群选择设备和模型。每个 Agent 已有自己的配置，之后也可以随时邀请成员。</div><p class="error" id="room-error"></p></form>`,`<small>新群与已有群的上下文独立</small><button class="primary" form="room-form">创建群聊</button>`);$('#room-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),ids=f.getAll('members'),title=f.get('title').trim();if(!title||!ids.length){$('#room-error').textContent='请填写群名，并至少邀请一位成员。';return}const r=room(uid(),title,ids,true,[{system:'群聊已创建，直接发消息或 @ 成员开始讨论。'}]);rooms.push(r);active=r.id;close();render()}}
function member(id){const a=current().members.find(a=>a.id===id);show('角色与本群配置',`<div class="row">${avatar(a,true)}<div><h3>${escapeHTML(a.name)}</h3><small>${a.temp?'仅本群的临时成员':'从我的 Agent 邀请'}</small></div></div><p style="margin:20px 0">${escapeHTML(a.role)}</p><div class="agent-card">运行设备：${escapeHTML(deviceName(a))}<br>工作目录：${escapeHTML(a.path)}<br>模型：${escapeHTML(a.model)}<br>思考强度：${escapeHTML(a.effort)}</div><div class="notice">这是本群加入时的配置快照。编辑 Agent 默认配置不会自动改写此处。本草图不演示运行中切换配置。</div>`)}
function detail(id){const m=current().messages.find(m=>m.id===id),a=current().members.find(a=>a.id===m?.from);if(!a)return;show('执行细节 · 模拟示例',`<div class="row">${avatar(a)}<div><h3>${escapeHTML(a.name)}</h3><small>${escapeHTML(deviceName(a))}</small></div></div><ol class="steps"><li>接收本群文字与本次图片<br><small>不带入其他群历史</small></li><li>使用成员配置：${escapeHTML(a.model)} / ${escapeHTML(a.effort)}</li><li>在主时间线展示公开回复</li></ol><div class="notice">这是流程说明，不是真实工具日志。本页面没有运行 Agent、调用 Skills 或连接远端设备，也不会展示隐藏推理。</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,r=current();switch(action){case'close':close();break;case'chat':close();break;case'switch':active=id;render();break;case'library':library();break;case'edit':editAgent(id);break;case'create-agent':editAgent();break;case'temporary':editAgent(null,true);break;case'invite':invite();break;case'newroom':newRoom();break;case'auto':r.auto=!r.auto;render();break;case'member':member(id);break;case'detail':detail(id);break;case'mentions':mentions();break;case'mention':r.draft=r.draft.replace(/@$/,'')+'@'+r.members.find(a=>a.id===id).name+' ';$('#draft').value=r.draft;$('#mention-menu').hidden=true;$('#draft').focus();break;case'image':$('#message-files').click();break;case'avatar':$('#avatar-file').click();break;case'remove-avatar':editorState.avatar='';$('#avatar-preview').innerHTML=avatar({name:$('#agent-form').elements.name.value||'新'},true);break;case'remove-image':URL.revokeObjectURL(r.images[Number(id)].url);r.images.splice(Number(id),1);renderImages();break;case'send':send();break;case'example':r.draft=b.dataset.kind==='mention'?r.members.slice(0,2).map(a=>'@'+a.name).join(' ')+' 帮我看看这个想法的价值和实现路径。':'这个功能在技术实现上有哪些风险？';$('#draft').value=r.draft;$('#draft').focus();break;case'about':show('这版可以体验什么',`<p>按原版三栏群聊稿重建，保持亮色，不是旧 HTML 恢复。</p><ol class="steps"><li>在 Agent 管理中配置头像、角色、设备、模型和强度。</li><li>新建或切换群聊；从成员栏邀请已有 Agent，或创建临时成员。</li><li>@ 多人，上传或粘贴图片，查看预设回复和模拟执行细节。</li></ol><div class="notice">所有设备与模型能力列表均为示例，所有回复均为模拟。配置和图片不上传，刷新重置。本稿不演示自动辩论调度或真实 Paws 预设导入。</div>`);break}});
$('#message-files').onchange=e=>{addImages([...e.target.files]);e.target.value=''};
$('#avatar-file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!editorState)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024){toast('请选择 5 MB 以内的 PNG、JPEG 或 WebP');return}editorState.avatar=URL.createObjectURL(f);$('#avatar-preview').innerHTML=avatar({name:$('#agent-form').elements.name.value||'新',avatar:editorState.avatar},true)};
render();
</script></body></html>
